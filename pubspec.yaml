name: miclan
description: MiClan - Seguridad Familiar / Localizador Grupal en Tiempo Real
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Iconos (corrige warning de fuentes en build)
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.6
  firebase_storage: ^12.3.7

  # State management / Navegacion / UI
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1

  # Mapas y Geolocalizacion
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Multimedia y Chat
  image_picker: ^1.1.2
  record: ^7.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_picker: ^8.1.2

  # Persistencia Local (Caja Negra)
  sqflite: ^2.3.3
  path: ^1.9.0

  # Background / Android Nativo
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.2.2
  android_intent_plus: ^6.1.0

  # Notificaciones locales
  flutter_local_notifications: ^18.0.0

dependency_overrides:
  # Solucion a conflicto de versiones con Kotlin Gradle Plugin
  android_intent_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
